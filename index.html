<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nana's Cozy Home 🏡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fdf6ec; -webkit-tap-highlight-color: transparent; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;


const COLORS = {
  cream: "#fdf6ec", tan: "#e8d5b7", sage: "#8aab8a", sage2: "#5e8a5e",
  blush: "#f4a9b0", blue: "#8fb3c8", gold: "#e8b84b", brown: "#8b6347",
  dark: "#3d3530", white: "#fefcf8",
};

// ── MINI ACTIVITIES ──────────────────────────────────────

function TVActivity({ onCozy }) {
  const channels = [
    { icon: "🐱", name: "Cat TV", desc: "Cats doing cat things. A kitten falls off a box. Perfection.", color: "#f4a9b0" },
    { icon: "🍳", name: "Cooking Show", desc: "A calm chef is making pasta from scratch. The kitchen smells amazing (somehow).", color: "#e8b84b" },
    { icon: "🌿", name: "Nature Doc", desc: "David Attenborough voice: 'The capybara approaches the water... serenely.'", color: "#8aab8a" },
    { icon: "🎬", name: "Rom-com", desc: "She runs through the rain. He's waiting at the café. They order the same thing. Obviously.", color: "#8fb3c8" },
    { icon: "🌙", name: "ASMR", desc: "Someone is folding towels very softly. You didn't know you needed this. You did.", color: "#9b7ecb" },
    { icon: "🏡", name: "Cozy Vlogs", desc: "A girl in a tiny apartment makes soup, reads, and goes to bed at 9pm. Aspirational.", color: "#e8a040" },
  ];
  const [watching, setWatching] = useState(null);
  const [volume, setVolume] = useState(5);
  const [mins, setMins] = useState(0);

  useEffect(() => {
    if (!watching) return;
    const id = setInterval(() => setMins(m => m + 1), 3000);
    return () => clearInterval(id);
  }, [watching]);

  return (
    <div>
      <div style={{ background: "#1a1a2a", borderRadius: 16, padding: 20, marginBottom: 16, minHeight: 160, display: "flex", alignItems: "center", justifyContent: "center", position: "relative" }}>
        {watching ? (
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: "3.5rem", marginBottom: 8 }}>{watching.icon}</div>
            <div style={{ color: "#fff", fontWeight: 700, marginBottom: 6 }}>{watching.name}</div>
            <div style={{ color: "#aaa", fontSize: "0.85rem", maxWidth: 280, lineHeight: 1.6 }}>{watching.desc}</div>
            <div style={{ color: "#666", fontSize: "0.75rem", marginTop: 10 }}>⏱ {mins} min watched</div>
          </div>
        ) : (
          <div style={{ color: "#555", fontSize: "0.9rem" }}>📺 Pick a channel~</div>
        )}
        <div style={{ position: "absolute", top: 10, right: 12, color: "#3a3", fontSize: "0.7rem", fontWeight: 700 }}>● LIVE</div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 8, marginBottom: 14 }}>
        {channels.map((ch, i) => (
          <div key={i} onClick={() => { setWatching(ch); setMins(0); onCozy(8); }}
            style={{ background: watching === ch ? ch.color : COLORS.cream, border: `2px solid ${watching === ch ? ch.color : COLORS.tan}`, borderRadius: 12, padding: "10px 8px", cursor: "pointer", textAlign: "center", transition: "all 0.2s" }}>
            <div style={{ fontSize: "1.5rem" }}>{ch.icon}</div>
            <div style={{ fontSize: "0.7rem", fontWeight: 700, marginTop: 3, color: watching === ch ? "#fff" : COLORS.dark }}>{ch.name}</div>
          </div>
        ))}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <span style={{ fontSize: "0.82rem", color: "#9a8070" }}>🔊</span>
        <input type="range" min={0} max={10} value={volume} onChange={e => setVolume(+e.target.value)} style={{ flex: 1, accentColor: COLORS.blue }} />
        <span style={{ fontSize: "0.78rem", color: "#9a8070", minWidth: 20 }}>{volume}</span>
      </div>
    </div>
  );
}

function SleepActivity({ onCozy }) {
  const [phase, setPhase] = useState("awake"); // awake → drifting → sleeping → dreaming → waking
  const [dream, setDream] = useState(null);
  const [breathCount, setBreathCount] = useState(0);
  const dreams = [
    "You're in a field of lavender. A cat is sitting next to you. Neither of you speaks. It's enough.",
    "You're in a cozy library that goes on forever. Every book is one you've always meant to read.",
    "It's snowing softly outside a warmly lit café. You're inside with a hot drink. The snow doesn't touch you.",
    "You're floating slowly above your garden. The plants wave at you. You wave back.",
    "You find a door in your house you'd never noticed. Behind it is a tiny room full of pillows and soft light.",
    "You're watching a sunset that lasts for hours. Someone hands you a blanket. You say thank you.",
  ];

  const breathe = () => {
    setBreathCount(b => b + 1);
    if (breathCount >= 2) { setPhase("drifting"); onCozy(5); }
    if (breathCount >= 5) {
      setPhase("sleeping");
      onCozy(10);
      setTimeout(() => {
        setDream(dreams[Math.floor(Math.random() * dreams.length)]);
        setPhase("dreaming");
        onCozy(15);
      }, 3000);
    }
  };

  const wake = () => { setPhase("waking"); setTimeout(() => { setPhase("awake"); setBreathCount(0); setDream(null); }, 1500); };

  const bg = { awake: "#fdf6ec", drifting: "#e8f0f8", sleeping: "#d0dce8", dreaming: "#c8d0e8", waking: "#e8f0f8" }[phase];

  return (
    <div style={{ textAlign: "center", transition: "all 1s" }}>
      <div style={{ background: bg, borderRadius: 20, padding: 28, marginBottom: 16, minHeight: 180, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 12, transition: "background 2s" }}>
        {phase === "awake" && <>
          <div style={{ fontSize: "3rem" }}>😌</div>
          <div style={{ fontWeight: 700 }}>Ready to rest?</div>
          <div style={{ fontSize: "0.84rem", color: "#9a8070" }}>Breathe slowly to drift off~</div>
        </>}
        {phase === "drifting" && <>
          <div style={{ fontSize: "3rem", animation: "pulse 2s infinite" }}>😴</div>
          <div style={{ fontWeight: 700, color: "#5a6898" }}>Getting sleepy...</div>
          <div style={{ fontSize: "0.84rem", color: "#7a8aaa" }}>Keep breathing softly~</div>
        </>}
        {phase === "sleeping" && <>
          <div style={{ fontSize: "3rem" }}>💤</div>
          <div style={{ fontWeight: 700, color: "#4a5888" }}>Nana is sleeping...</div>
        </>}
        {phase === "dreaming" && <>
          <div style={{ fontSize: "3rem" }}>🌙</div>
          <div style={{ fontWeight: 700, color: "#4a5888", marginBottom: 8 }}>Dreaming~</div>
          <div style={{ fontSize: "0.88rem", color: "#5a6898", fontStyle: "italic", lineHeight: 1.7, maxWidth: 280 }}>{dream}</div>
        </>}
        {phase === "waking" && <>
          <div style={{ fontSize: "3rem" }}>🌅</div>
          <div style={{ fontWeight: 700, color: COLORS.brown }}>Good morning, Nana~</div>
        </>}
      </div>
      {(phase === "awake" || phase === "drifting") && (
        <button onClick={breathe} style={{ background: COLORS.blue, color: "#fff", border: "none", borderRadius: 999, padding: "12px 28px", fontFamily: "inherit", fontWeight: 700, fontSize: "0.9rem", cursor: "pointer" }}>
          {breathCount === 0 ? "🌬 Take a breath" : breathCount < 3 ? "🌬 Breathe out..." : "🌬 Almost asleep..."}
        </button>
      )}
      {(phase === "sleeping" || phase === "dreaming") && (
        <button onClick={wake} style={{ background: COLORS.gold, color: COLORS.dark, border: "none", borderRadius: 999, padding: "12px 28px", fontFamily: "inherit", fontWeight: 700, fontSize: "0.9rem", cursor: "pointer" }}>
          ☀️ Wake up
        </button>
      )}
    </div>
  );
}

function BathActivity({ onCozy }) {
  const [temp, setTemp] = useState(38);
  const [bubbles, setBubbles] = useState(false);
  const [candles, setCandles] = useState(false);
  const [lights, setLights] = useState("warm"); // warm | blue | purple | off
  const [music, setMusic] = useState(null);
  const [bathSalt, setBathSalt] = useState(null);
  const [soaking, setSoaking] = useState(false);
  const [soakMins, setSoakMins] = useState(0);
  const [tick, setTick] = useState(0);
  const [thought, setThought] = useState(null);

  const bathThoughts = [
    "今天辛苦了，热水会把所有的疲惫泡走的。",
    "什么都不用想，就泡着就好。",
    "水温刚好，这是今天最好的时刻。",
    "泡澡是一种仪式，告诉自己：工作结束了，现在是我的时间。",
    "什么都可以等，但这个澡不等。",
    "Nana deserves this. 完全deserves。",
    "外面的世界很吵，但浴室里只有水声。",
  ];

  useEffect(() => {
    if (!soaking) return;
    const id = setInterval(() => {
      setSoakMins(m => m + 1);
      setTick(t => t + 1);
      onCozy(4);
      // Random bath thought every ~3 mins
      if (soakMins > 0 && soakMins % 3 === 0) {
        setThought(bathThoughts[Math.floor(Math.random() * bathThoughts.length)]);
        setTimeout(() => setThought(null), 6000);
      }
    }, 4000);
    return () => clearInterval(id);
  }, [soaking, soakMins]);

  // Ambient light colors
  const lightSchemes = {
    warm:   { bg: "linear-gradient(160deg,#fdecd4,#f8d4b0,#f0c890)", glow: "rgba(255,180,80,0.3)",  accent: "#e8b040", label: "🕯️ Warm" },
    blue:   { bg: "linear-gradient(160deg,#c8e8f8,#a8d0f0,#90b8e8)", glow: "rgba(100,160,240,0.3)", accent: "#6898e0", label: "🌊 Ocean" },
    purple: { bg: "linear-gradient(160deg,#e0d0f8,#c8b0f0,#b090e0)", glow: "rgba(160,100,220,0.3)", accent: "#9060c8", label: "🔮 Lavender" },
    off:    { bg: "linear-gradient(160deg,#2a2230,#1a1828,#120e20)",  glow: "rgba(80,40,120,0.2)",  accent: "#504070", label: "🌙 Moonlight" },
  };
  const scheme = lightSchemes[lights];

  const salts = [
    { id:"rose",     e:"🌹", n:"玫瑰",     color:"#f4b0c0", desc:"舒缓放松" },
    { id:"lavender", e:"💜", n:"薰衣草",   color:"#c8a8e8", desc:"助眠安神" },
    { id:"yuzu",     e:"🍋", n:"柚子",     color:"#f0d870", desc:"提神醒脑" },
    { id:"milk",     e:"🥛", n:"牛奶",     color:"#f0e8d8", desc:"嫩滑肌肤" },
    { id:"green",    e:"🍵", n:"绿茶",     color:"#b0d8a0", desc:"清新排毒" },
  ];

  const musicOpts = [
    { id:"rain",   e:"🌧️", n:"雨声" },
    { id:"lofi",   e:"🎵", n:"Lo-fi" },
    { id:"jazz",   e:"🎷", n:"爵士" },
    { id:"ocean",  e:"🌊", n:"海浪" },
    { id:"forest", e:"🌿", n:"森林" },
  ];

  const tempLabel = temp < 35 ? "凉水 🧊" : temp < 37 ? "温温的 🌡" : temp < 39 ? "刚刚好 ✨" : temp < 42 ? "好烫好爽 🔥" : "沸腾了！🥵";
  const waterColor = temp < 36 ? "rgba(180,220,255,0.6)" : temp < 39 ? "rgba(160,200,255,0.6)" : temp < 42 ? "rgba(200,160,255,0.6)" : "rgba(255,160,160,0.6)";

  // Bubble positions (animated)
  const bubblePos = Array.from({length:12},(_,i)=>({
    x: 10+Math.sin(i*1.3)*35+35,
    delay: i*0.3,
    size: 0.6+Math.sin(i*0.7)*0.4,
  }));

  return (
    <div>
      {/* ── BATH SCENE ── */}
      <div style={{ background: scheme.bg, borderRadius:20, marginBottom:16,
        position:"relative", overflow:"hidden", transition:"background 1s ease",
        boxShadow:`0 8px 32px ${scheme.glow}, inset 0 1px 0 rgba(255,255,255,0.4)`,
        minHeight: soaking ? 240 : 180 }}>

        {/* Ambient glow */}
        <div style={{ position:"absolute", inset:0,
          background:`radial-gradient(ellipse at 50% 80%, ${scheme.glow}, transparent 70%)`,
          pointerEvents:"none" }}/>

        {/* Candles */}
        {candles && [["12%",14],["82%",14],["5%",60],["90%",55]].map(([l,t],i)=>(
          <div key={i} style={{ position:"absolute", left:l, top:t, fontSize:"1.1rem",
            filter:`drop-shadow(0 0 ${8+Math.sin(tick*0.3+i)*4}px ${scheme.accent})`,
            transition:"filter 0.5s" }}>🕯️</div>
        ))}

        {/* Bath salt color in water */}
        {bathSalt && (
          <div style={{ position:"absolute", bottom:0, left:0, right:0, height:"45%",
            background:`linear-gradient(to top, ${salts.find(s=>s.id===bathSalt)?.color}66, transparent)`,
            transition:"background 1s", pointerEvents:"none" }}/>
        )}

        {/* Main bath scene */}
        <div style={{ padding:"22px 20px 18px", position:"relative", zIndex:1 }}>

          {/* Shelf with items */}
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:16 }}>
            <div style={{ display:"flex", gap:8, alignItems:"flex-end" }}>
              {candles && <div style={{ fontSize:"1.4rem", filter:"drop-shadow(0 0 6px #ffd080)" }}>🕯️</div>}
              {bathSalt && <div style={{ fontSize:"1.2rem" }}>{salts.find(s=>s.id===bathSalt)?.e}</div>}
              {music && <div style={{ fontSize:"1.1rem", animation:"none" }}>🎵</div>}
            </div>
            <div style={{ display:"flex", gap:6, alignItems:"flex-end" }}>
              <div style={{ fontSize:"1rem", opacity:0.8 }}>🧴</div>
              <div style={{ fontSize:"1rem", opacity:0.8 }}>🪥</div>
              <div style={{ fontSize:"1.1rem", opacity:0.9 }}>🌿</div>
            </div>
          </div>

          {/* Bathtub */}
          <div style={{ background:`linear-gradient(180deg,${waterColor},${waterColor.replace("0.6","0.8")})`,
            borderRadius:"50% 50% 20px 20px / 30px 30px 20px 20px",
            padding: soaking ? "28px 20px 20px" : "18px 20px 16px",
            position:"relative", overflow:"hidden", transition:"all 0.8s ease",
            border:"3px solid rgba(255,255,255,0.5)",
            boxShadow:`inset 0 4px 16px rgba(255,255,255,0.3), inset 0 -4px 16px ${waterColor}` }}>

            {/* Water surface shimmer */}
            <div style={{ position:"absolute", top:0, left:0, right:0, height:8,
              background:"linear-gradient(90deg,transparent,rgba(255,255,255,0.5),transparent)",
              borderRadius:"50%", animation:"none",
              transform:`translateX(${Math.sin(tick*0.2)*20}px)`, transition:"transform 2s ease" }}/>

            {/* Bubbles */}
            {bubbles && bubblePos.map((b,i)=>(
              <div key={i} style={{ position:"absolute",
                bottom: `${20+Math.sin(tick*0.15+i)*12}%`,
                left:`${b.x}%`,
                width: `${b.size*14}px`, height:`${b.size*14}px`,
                borderRadius:"50%",
                background:"rgba(255,255,255,0.4)",
                border:"1px solid rgba(255,255,255,0.7)",
                transition:"bottom 2s ease, left 1s ease",
                pointerEvents:"none" }}/>
            ))}

            {/* Nana in the bath */}
            {soaking ? (
              <div style={{ textAlign:"center" }}>
                <div style={{ fontSize:"2.2rem", marginBottom:4 }}>🧖‍♀️</div>
                <div style={{ fontWeight:800, fontSize:"0.9rem",
                  color: lights==="off"?"#c8b8f0":"#5a3898" }}>
                  泡着呢~ 好舒服
                </div>
                <div style={{ fontSize:"0.78rem", color: lights==="off"?"#a898d0":"#7a5aaa", marginTop:4 }}>
                  {soakMins} 分钟 · {temp}°C
                  {bubbles?" · 🫧":""}
                  {bathSalt ? ` · ${salts.find(s=>s.id===bathSalt)?.n}浴盐`:""}
                  {music ? ` · ${musicOpts.find(m=>m.id===music)?.n}`:""}
                </div>
              </div>
            ) : (
              <div style={{ textAlign:"center", color:"rgba(100,80,140,0.7)", fontSize:"0.85rem" }}>
                澡快准备好了~ 快进来
              </div>
            )}
          </div>

          {/* Float-up thought bubble */}
          {thought && (
            <div style={{ position:"absolute", bottom:20, left:"5%", right:"5%",
              background:"rgba(255,255,255,0.92)", borderRadius:14,
              padding:"10px 14px", fontSize:"0.82rem", color:"#6a4898",
              fontStyle:"italic", textAlign:"center", lineHeight:1.6,
              boxShadow:"0 4px 16px rgba(0,0,0,0.12)", zIndex:10 }}>
              ✨ {thought}
            </div>
          )}
        </div>
      </div>

      {/* ── CONTROLS ── */}
      <div style={{ display:"flex", flexDirection:"column", gap:14 }}>

        {/* Temperature */}
        <div style={{ background:COLORS.white, borderRadius:14, padding:"14px 16px",
          border:`2px solid ${COLORS.tan}` }}>
          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
            <div style={{ fontSize:"0.82rem", fontWeight:800, color:COLORS.dark }}>🌡️ 水温</div>
            <div style={{ fontSize:"0.82rem", fontWeight:700, color:scheme.accent }}>{temp}°C {tempLabel}</div>
          </div>
          <input type="range" min={32} max={45} value={temp}
            onChange={e => setTemp(+e.target.value)}
            style={{ width:"100%", accentColor:scheme.accent }} />
        </div>

        {/* Mood lighting */}
        <div style={{ background:COLORS.white, borderRadius:14, padding:"14px 16px",
          border:`2px solid ${COLORS.tan}` }}>
          <div style={{ fontSize:"0.82rem", fontWeight:800, color:COLORS.dark, marginBottom:10 }}>💡 氛围灯</div>
          <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
            {Object.entries(lightSchemes).map(([key,s])=>(
              <button key={key} onClick={()=>{ setLights(key); onCozy(6); }}
                style={{ flex:1, minWidth:60, background: lights===key ? s.accent : COLORS.cream,
                  color: lights===key ? "#fff" : COLORS.dark,
                  border:`2px solid ${lights===key ? s.accent : COLORS.tan}`,
                  borderRadius:10, padding:"8px 6px", cursor:"pointer",
                  fontFamily:"inherit", fontWeight:700, fontSize:"0.78rem",
                  transition:"all 0.3s" }}>
                {s.label}
              </button>
            ))}
          </div>
        </div>

        {/* Bath salts */}
        <div style={{ background:COLORS.white, borderRadius:14, padding:"14px 16px",
          border:`2px solid ${COLORS.tan}` }}>
          <div style={{ fontSize:"0.82rem", fontWeight:800, color:COLORS.dark, marginBottom:10 }}>🧂 浴盐</div>
          <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
            {salts.map(s=>(
              <div key={s.id} onClick={()=>{ setBathSalt(bathSalt===s.id?null:s.id); onCozy(5); }}
                style={{ flex:1, minWidth:50, background: bathSalt===s.id ? s.color+"aa" : COLORS.cream,
                  border:`2px solid ${bathSalt===s.id ? s.color : COLORS.tan}`,
                  borderRadius:12, padding:"9px 6px", cursor:"pointer", textAlign:"center",
                  transition:"all 0.2s" }}>
                <div style={{ fontSize:"1.3rem" }}>{s.e}</div>
                <div style={{ fontSize:"0.65rem", fontWeight:700, color:COLORS.dark, marginTop:2 }}>{s.n}</div>
                <div style={{ fontSize:"0.58rem", color:"#9a8070" }}>{s.desc}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Music + extras */}
        <div style={{ background:COLORS.white, borderRadius:14, padding:"14px 16px",
          border:`2px solid ${COLORS.tan}` }}>
          <div style={{ fontSize:"0.82rem", fontWeight:800, color:COLORS.dark, marginBottom:10 }}>🎵 背景音乐</div>
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:10 }}>
            {musicOpts.map(m=>(
              <button key={m.id} onClick={()=>{ setMusic(music===m.id?null:m.id); onCozy(4); }}
                style={{ flex:1, minWidth:48, background: music===m.id ? "#e8f4e8" : COLORS.cream,
                  border:`2px solid ${music===m.id ? COLORS.sage : COLORS.tan}`,
                  borderRadius:10, padding:"7px 4px", cursor:"pointer",
                  fontFamily:"inherit", fontWeight:700, fontSize:"0.75rem",
                  transition:"all 0.2s" }}>
                {m.e} {m.n}
              </button>
            ))}
          </div>
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={()=>{ setBubbles(b=>!b); onCozy(5); }}
              style={{ flex:1, background: bubbles?"#d4eeff":COLORS.cream,
                border:`2px solid ${bubbles?COLORS.blue:COLORS.tan}`,
                borderRadius:10, padding:"9px", cursor:"pointer",
                fontFamily:"inherit", fontWeight:700, fontSize:"0.8rem" }}>
              🫧 {bubbles?"泡泡浴 ✓":"加泡泡"}
            </button>
            <button onClick={()=>{ setCandles(c=>!c); onCozy(5); }}
              style={{ flex:1, background: candles?"#fff3d4":COLORS.cream,
                border:`2px solid ${candles?COLORS.gold:COLORS.tan}`,
                borderRadius:10, padding:"9px", cursor:"pointer",
                fontFamily:"inherit", fontWeight:700, fontSize:"0.8rem" }}>
              🕯️ {candles?"蜡烛 ✓":"点蜡烛"}
            </button>
          </div>
        </div>

        {/* Get in / out */}
        {!soaking ? (
          <button onClick={()=>{ setSoaking(true); setSoakMins(0); setTick(0); onCozy(15); }}
            style={{ background:`linear-gradient(135deg,${scheme.accent},${scheme.accent}cc)`,
              color:"#fff", border:"none", borderRadius:999, padding:"14px",
              fontFamily:"inherit", fontWeight:800, fontSize:"1rem",
              cursor:"pointer", boxShadow:`0 6px 20px ${scheme.glow}`,
              letterSpacing:0.5 }}>
            🛁 好了，泡澡！
          </button>
        ) : (
          <button onClick={()=>{ setSoaking(false); onCozy(8); }}
            style={{ background:COLORS.tan, color:COLORS.dark, border:"none",
              borderRadius:999, padding:"12px", fontFamily:"inherit",

// ── TETRIS ───────────────────────────────────────────────
const COLS = 10, ROWS = 18;
const PIECES = [
  { shape: [[1,1,1,1]], color: "#8fb3c8" },           // I
  { shape: [[1,1],[1,1]], color: "#e8b84b" },          // O
  { shape: [[0,1,0],[1,1,1]], color: "#9b7ecb" },      // T
  { shape: [[1,0],[1,0],[1,1]], color: "#e8803a" },    // L
  { shape: [[0,1],[0,1],[1,1]], color: "#8aab8a" },    // J
  { shape: [[0,1,1],[1,1,0]], color: "#f4a9b0" },      // S
  { shape: [[1,1,0],[0,1,1]], color: "#e87060" },      // Z
];

function emptyBoard() { return Array.from({length:ROWS}, () => Array(COLS).fill(null)); }

function TetrisGame({ onCozy }) {
  const [board, setBoard] = useState(emptyBoard);
  const [piece, setPiece] = useState(null);
  const [pos, setPos] = useState({x:0,y:0});
  const [score, setScore] = useState(0);
  const [lines, setLines] = useState(0);
  const [status, setStatus] = useState("idle"); // idle | playing | paused | over
  const [next, setNext] = useState(null);
  const stateRef = useRef({});

  const randomPiece = () => PIECES[Math.floor(Math.random() * PIECES.length)];

  const fits = (b, sh, px, py) => {
    for (let r = 0; r < sh.length; r++)
      for (let c = 0; c < sh[r].length; c++)
        if (sh[r][c]) {
          const nr = py + r, nc = px + c;
          if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS || b[nr][nc]) return false;
        }
    return true;
  };

  const merge = (b, sh, px, py, color) => {
    const nb = b.map(r => [...r]);
    for (let r = 0; r < sh.length; r++)
      for (let c = 0; c < sh[r].length; c++)
        if (sh[r][c]) nb[py+r][px+c] = color;
    return nb;
  };

  const clearLines = (b) => {
    const kept = b.filter(r => r.some(c => !c));
    const cleared = ROWS - kept.length;
    const nb = [...Array.from({length:cleared}, ()=>Array(COLS).fill(null)), ...kept];
    return { nb, cleared };
  };

  const spawnPiece = (b, nextP) => {
    const p = nextP || randomPiece();
    const nx = Math.floor((COLS - p.shape[0].length) / 2);
    if (!fits(b, p.shape, nx, 0)) { setStatus("over"); return null; }
    setPiece(p);
    setPos({x: nx, y: 0});
    setNext(randomPiece());
    return p;
  };

  const lock = useRef(null);

  const drop = useRef(() => {});
  drop.current = () => {
    const { b, p, px, py } = stateRef.current;
    if (!p) return;
    if (fits(b, p.shape, px, py + 1)) {
      setPos(pos => ({ ...pos, y: pos.y + 1 }));
    } else {
      const nb = merge(b, p.shape, px, py, p.color);
      const { nb: cb, cleared } = clearLines(nb);
      setBoard(cb);
      if (cleared > 0) {
        const pts = [0,100,300,500,800][cleared] || 800;
        setScore(s => s + pts);
        setLines(l => l + cleared);
        onCozy(cleared * 5);
      }
      spawnPiece(cb, stateRef.current.next);
    }
  };

  useEffect(() => {
    stateRef.current = { b: board, p: piece, px: pos.x, py: pos.y, next };
  });

  useEffect(() => {
    if (status !== "playing") { clearInterval(lock.current); return; }
    const speed = Math.max(100, 600 - lines * 20);
    lock.current = setInterval(() => drop.current(), speed);
    return () => clearInterval(lock.current);
  }, [status, lines]);

  const move = (dx) => {
    const { b, p, px, py } = stateRef.current;
    if (!p) return;
    if (fits(b, p.shape, px + dx, py)) setPos(pos => ({...pos, x: pos.x + dx}));
  };

  const rotate = () => {
    const { b, p, px, py } = stateRef.current;
    if (!p) return;
    const rotated = p.shape[0].map((_, i) => p.shape.map(r => r[i]).reverse());
    let nx = px;
    if (!fits(b, rotated, nx, py)) nx = px - 1;
    if (!fits(b, rotated, nx, py)) nx = px + 1;
    if (fits(b, rotated, nx, py)) { setPiece({...p, shape: rotated}); setPos(pos=>({...pos,x:nx})); }
  };

  const hardDrop = () => {
    const { b, p, px, py } = stateRef.current;
    if (!p) return;
    let ny = py;
    while (fits(b, p.shape, px, ny + 1)) ny++;
    setPos(pos => ({...pos, y: ny}));
    setTimeout(() => drop.current(), 30);
  };

  const start = () => {
    const b = emptyBoard();
    setBoard(b);
    setScore(0); setLines(0);
    setStatus("playing");
    const p = randomPiece();
    setNext(randomPiece());
    const nx = Math.floor((COLS - p.shape[0].length) / 2);
    setPiece(p); setPos({x:nx, y:0});
  };

  // Render board with active piece
  const display = board.map(r => [...r]);
  if (piece && status === "playing") {
    // ghost
    let gy = pos.y;
    while (fits(board, piece.shape, pos.x, gy + 1)) gy++;
    for (let r = 0; r < piece.shape.length; r++)
      for (let c = 0; c < piece.shape[r].length; c++)
        if (piece.shape[r][c] && gy+r < ROWS) display[gy+r][pos.x+c] = display[gy+r][pos.x+c] || "ghost";
    for (let r = 0; r < piece.shape.length; r++)
      for (let c = 0; c < piece.shape[r].length; c++)
        if (piece.shape[r][c] && pos.y+r < ROWS) display[pos.y+r][pos.x+c] = piece.color;
  }

  const CELL = 22;

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 12 }}>
      {/* Score bar */}
      <div style={{ display: "flex", gap: 16, width: "100%", justifyContent: "center" }}>
        <div style={{ background: COLORS.cream, borderRadius: 10, padding: "8px 16px", textAlign: "center" }}>
          <div style={{ fontSize: "0.7rem", color: "#9a8070", fontWeight: 700 }}>SCORE</div>
          <div style={{ fontWeight: 900, fontSize: "1.1rem", color: COLORS.brown }}>{score}</div>
        </div>
        <div style={{ background: COLORS.cream, borderRadius: 10, padding: "8px 16px", textAlign: "center" }}>
          <div style={{ fontSize: "0.7rem", color: "#9a8070", fontWeight: 700 }}>LINES</div>
          <div style={{ fontWeight: 900, fontSize: "1.1rem", color: COLORS.brown }}>{lines}</div>
        </div>
        {next && (
          <div style={{ background: COLORS.cream, borderRadius: 10, padding: "8px 12px", textAlign: "center" }}>
            <div style={{ fontSize: "0.7rem", color: "#9a8070", fontWeight: 700, marginBottom: 4 }}>NEXT</div>
            <div style={{ display: "grid", gridTemplateColumns: `repeat(${next.shape[0].length},10px)`, gap: 1 }}>
              {next.shape.flatMap((row, r) => row.map((c, col) => (
                <div key={`${r}-${col}`} style={{ width: 10, height: 10, borderRadius: 2, background: c ? next.color : "transparent" }} />
              )))}
            </div>
          </div>
        )}
      </div>

      {/* Board */}
      <div style={{ position: "relative", border: `3px solid ${COLORS.tan}`, borderRadius: 8, background: "#1a1a2a", overflow: "hidden" }}>
        <div style={{ display: "grid", gridTemplateColumns: `repeat(${COLS},${CELL}px)`, gap: 1, padding: 2 }}>
          {display.flatMap((row, r) => row.map((cell, c) => (
            <div key={`${r}-${c}`} style={{
              width: CELL, height: CELL, borderRadius: 3,
              background: cell === "ghost" ? "rgba(255,255,255,0.08)" : cell || "rgba(255,255,255,0.03)",
              border: cell && cell !== "ghost" ? `1px solid rgba(255,255,255,0.2)` : "1px solid rgba(255,255,255,0.03)",
              boxShadow: cell && cell !== "ghost" ? `inset 0 1px 0 rgba(255,255,255,0.3)` : "none",
              transition: "background 0.05s",
            }} />
          )))}
        </div>

        {/* Overlays */}
        {status === "idle" && (
          <div style={{ position: "absolute", inset: 0, background: "rgba(26,26,42,0.92)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 12 }}>
            <div style={{ fontSize: "2.5rem" }}>🟦</div>
            <div style={{ color: "#fff", fontWeight: 700, fontSize: "1rem" }}>Nana's Tetris</div>
            <button onClick={start} style={{ background: COLORS.blush, color: "#fff", border: "none", borderRadius: 999, padding: "10px 24px", fontFamily: "inherit", fontWeight: 700, cursor: "pointer", fontSize: "0.9rem" }}>
              Start ▶
            </button>
          </div>
        )}
        {status === "over" && (
          <div style={{ position: "absolute", inset: 0, background: "rgba(26,26,42,0.92)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 10 }}>
            <div style={{ color: "#fff", fontWeight: 700, fontSize: "1.1rem" }}>Game Over 😅</div>
            <div style={{ color: "#aaa", fontSize: "0.85rem" }}>Score: {score} · Lines: {lines}</div>
            <button onClick={start} style={{ background: COLORS.sage, color: "#fff", border: "none", borderRadius: 999, padding: "10px 24px", fontFamily: "inherit", fontWeight: 700, cursor: "pointer" }}>
              Play Again 🔄
            </button>
          </div>
        )}
        {status === "paused" && (
          <div style={{ position: "absolute", inset: 0, background: "rgba(26,26,42,0.85)", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <div style={{ color: "#fff", fontWeight: 700, fontSize: "1.2rem" }}>Paused ⏸</div>
          </div>
        )}
      </div>

      {/* Controls */}
      {status === "playing" || status === "paused" ? (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8, width: "100%" }}>
          <div style={{ display: "flex", gap: 8 }}>
            <button onPointerDown={() => move(-1)} style={btnStyle}>◀</button>
            <button onPointerDown={rotate} style={btnStyle}>↻</button>
            <button onPointerDown={() => move(1)} style={btnStyle}>▶</button>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onPointerDown={hardDrop} style={{...btnStyle, background: COLORS.blush, flex: 2, padding: "12px 0" }}>▼ Drop</button>
            <button onPointerDown={() => setStatus(s => s === "paused" ? "playing" : "paused")} style={{...btnStyle, background: "#555"}}>
              {status === "paused" ? "▶" : "⏸"}
            </button>
          </div>
          <div style={{ fontSize: "0.72rem", color: "#9a8070" }}>Tap buttons · Hold for repeat</div>
        </div>
      ) : null}
    </div>
  );
}
