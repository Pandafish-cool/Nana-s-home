<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>🍱 吃饭彩蛋 · 试玩</title>
<style>
  :root { --accent:#c0563a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; font-family:'Nunito','PingFang SC','Microsoft YaHei',system-ui,sans-serif; }
  body { background:radial-gradient(circle at 50% 30%, #3a2230, #1a1018); overflow:hidden; }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 20px; overflow:hidden; }
  .hd { color:#ffd86a; font-weight:800; font-size:.85rem; letter-spacing:1px; margin-bottom:10px; text-align:center; }
  .title { color:#fff; font-weight:800; font-size:clamp(1.3rem,5vw,1.8rem); margin-bottom:6px; text-align:center; }
  .sub { color:rgba(255,255,255,.6); font-size:.74rem; margin-bottom:22px; text-align:center; }
  .boxes { display:flex; gap:18px; justify-content:center; }
  .box { font-size:3.6rem; cursor:pointer; user-select:none; filter:drop-shadow(0 4px 8px rgba(0,0,0,.45)); animation:bob 1.6s ease-in-out infinite; }
  .box:nth-child(2){animation-delay:.2s} .box:nth-child(3){animation-delay:.4s}
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  @keyframes pop { 0%{transform:scale(.85);opacity:0} 60%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
  .win { text-align:center; max-width:320px; animation:pop .55s ease; }
  .win .em { font-size:2.6rem; margin-bottom:8px; }
  .ticket { background:linear-gradient(135deg,#fff3e0,#ffe0ec); border-radius:16px; border:2px dashed #d8924a; padding:20px 18px; color:#7a4a20; box-shadow:0 8px 28px rgba(0,0,0,.4); }
  .ticket .t { font-weight:900; font-size:1.25rem; color:var(--accent); }
  .ticket .body { font-size:1rem; font-weight:700; margin:10px 0; line-height:1.9; }
  .ticket .no { font-size:.64rem; color:#a8742a; border-top:1px dashed #d8924a; padding-top:8px; margin-top:10px; }
  .btn { margin-top:18px; background:var(--accent); color:#fff; border:none; border-radius:12px; padding:11px 30px; font-family:inherit; font-weight:800; font-size:.98rem; cursor:pointer; }
  .conf { position:absolute; width:7px; height:11px; border-radius:1px; pointer-events:none; }
  .tag { position:fixed; top:10px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.4); font-size:.64rem; text-align:center; width:90%; }
</style>
</head>
<body>
  <div class="tag">🧪 试玩页 · 不在 nana home 主站里 · 仅你有链接</div>
  <div id="stage"></div>
<script>
(function(){
  var stage = document.getElementById('stage');
  var cols = ["#ff6b9d","#ffd24a","#6cc6ff","#9be36b","#c79bff"];
  function serial(){ return "NANA-" + (100 + Math.floor(Math.random()*900)); }
  function confetti(){
    for (var k=0;k<28;k++){
      var c=document.createElement('div'); c.className='conf';
      c.style.left=(Math.random()*100)+'%'; c.style.top=(-10-Math.random()*20)+'%'; c.style.background=cols[k%5];
      var dur=(1.8+Math.random()*1.4), delay=(Math.random()*0.4);
      c.style.transition='transform '+dur+'s linear '+delay+'s, opacity '+dur+'s linear '+delay+'s';
      stage.appendChild(c);
      (function(el){ requestAnimationFrame(function(){ requestAnimationFrame(function(){
        el.style.transform='translateY(120vh) rotate('+(360+Math.random()*360)+'deg)'; el.style.opacity='0';
      });});})(c);
      setTimeout((function(el){return function(){ el.remove(); };})(c),(dur+delay)*1000+200);
    }
  }
  function pick(){
    stage.innerHTML =
      '<div class="hd">🎉 连续吃午饭 7 天 · 抽奖时间！</div>'+
      '<div class="title">选一个饭盒打卡 👇</div>'+
      '<div class="sub">只能打开一个哦，想好再戳～</div>'+
      '<div class="boxes"><div class="box">🍱</div><div class="box">🍱</div><div class="box">🍱</div></div>';
    Array.prototype.forEach.call(stage.querySelectorAll('.box'), function(b){ b.onclick = win; });
  }
  function win(){
    confetti();
    stage.innerHTML =
      '<div class="win">'+
        '<div class="em">🍱✨</div>'+
        '<div class="ticket">'+
          '<div class="t">🎁 Nana 礼品券</div>'+
          '<div class="body">你猜是什么？🤫<br>请和商家联系～ 📞</div>'+
          '<div class="no">编号 '+serial()+' · 永久有效 · 仅限 Nana 使用 ✨</div>'+
        '</div>'+
        '<button class="btn" id="again">🎲 再玩一次</button>'+
      '</div>';
    document.getElementById('again').onclick = pick;
  }
  pick();
})();
</script>
</body>
</html>
